name: Discord Access Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/discord-access-diagnostic.yml"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: List Discord channels
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.Rugby_DISCORD_BOT_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os, requests
          token = os.environ["DISCORD_BOT_TOKEN"]
          h = {"Authorization": f"Bot {token}"}
          api = "https://discord.com/api/v10"
          guild_id = "1551020296700698744"
          r = requests.get(f"{api}/guilds/{guild_id}/channels", headers=h, timeout=30)
          print("STATUS", r.status_code)
          if r.ok:
              for ch in r.json():
                  print("CHANNEL", ch.get("id"), ch.get("name"), "TYPE", ch.get("type"))
          else:
              print(r.text[:500])
          PY
