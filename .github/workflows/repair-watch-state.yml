name: Repair Rugby Watch State

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-watch-state.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rebuild fixture index and apply watch choices
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.Rugby_DISCORD_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import monitor
          fixtures = monitor.fetch_all_fixtures()
          state = monitor.load_state()
          monitor.make_digest(fixtures, state)
          r1 = monitor.process_command("!watch 7 9", fixtures, state)
          if r1:
              monitor.send_discord(r1)
          r2 = monitor.process_command("!list", fixtures, state)
          if r2:
              monitor.send_discord(r2)
          monitor.save_state(state)
          PY
      - name: Persist repaired state
        shell: bash
        run: |
          git config user.name "rugby-monitor[bot]"
          git config user.email "rugby-monitor@users.noreply.github.com"
          git add state.json
          git commit -m "Repair rugby watch state"
          git push
