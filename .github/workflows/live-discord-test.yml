name: Rugby Live Discord Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/live-discord-test.yml"

jobs:
  live-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Post weekly rugby list to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.Rugby_DISCORD_BOT_TOKEN }}
        run: python monitor.py weekly
