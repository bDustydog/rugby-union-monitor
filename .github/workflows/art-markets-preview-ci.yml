name: Cairns Art Markets Preview CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "markets_monitor.py"
      - "markets_config.json"
      - "markets_state.json"
      - ".github/workflows/art-markets-monitor.yml"
      - ".github/workflows/art-markets-preview-ci.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile markets_monitor.py

      - name: Build live market preview
        run: python markets_monitor.py preview
